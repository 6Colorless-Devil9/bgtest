<div id="webgl-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  #webgl-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    background: #000000;
  }
</style>
<script>
  const container = document.getElementById('webgl-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);
  container.appendChild(renderer.domElement);

  const particlesCount = 800;
  const posArray = new Float32Array(particlesCount * 3);

  for(let i = 0; i < particlesCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 15;
  }

  const particlesGeometry = new THREE.BufferGeometry();
  particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

  const particlesMaterial = new THREE.PointsMaterial({
    size: 0.04,
    color: 0xffdf73, // Brighter gold for high contrast
    transparent: true,
    opacity: 0.9,
  });

  const particleMesh = new THREE.Points(particlesGeometry, particlesMaterial);
  scene.add(particleMesh);

  const geometry = new THREE.TorusKnotGeometry(2.5, 0.7, 100, 16);
  const material = new THREE.MeshBasicMaterial({
    color: 0x00f0ff, // Brighter cyan for enhanced contrast
    wireframe: true,
    transparent: true,
    opacity: 0.25
  });
  const torusKnot = new THREE.Mesh(geometry, material);
  scene.add(torusKnot);

  camera.position.z = 5;

  let mouseX = 0;
  let mouseY = 0;
  let targetX = 0;
  let targetY = 0;

  document.addEventListener('mousemove', (event) => {
    mouseX = (event.clientX - window.innerWidth / 2) * 0.001;
    mouseY = (event.clientY - window.innerHeight / 2) * 0.001;
  });

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);

    targetX = targetX + (mouseX - targetX) * 0.05;
    targetY = targetY + (mouseY - targetY) * 0.05;

    particleMesh.rotation.y = clock.getElapsedTime() * 0.03 + targetX;
    particleMesh.rotation.x = targetY;

    torusKnot.rotation.x = clock.getElapsedTime() * 0.1;
    torusKnot.rotation.y = clock.getElapsedTime() * 0.15;

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
